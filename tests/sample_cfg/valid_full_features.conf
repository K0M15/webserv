server {
    listen 127.0.0.1:8080 default_server;
    listen 8443;
    server_name full.example.com www.full.example.com;
    root /var/www/full;
    index index.html;
    dirindex on;
    max_header_size 4096;
    max_body_size 2000000;
    error_page 404 /errors/404.html;
    missing_content_type default application/octet-stream;
    location / {
        methods get post;
        root /var/www/full; # inline comment after a directive
    }
    location /cgi-bin {
        cgi_extension .py;
        cgi .py /usr/bin/python3;
        upload_dir /tmp/uploads;
    }
    location /old {
        redirect /new;
    }
}
