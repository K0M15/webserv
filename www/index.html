<html>
	<head>
		<title>Fine Dining</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="stylesheet" href="assets/css/custom.css" />
	</head>
	<body class="is-preload">
		<div id="page-wrapper">

			<!-- Header -->
				<section id="header">
					<div class="container">

						<!-- Logo -->
							<h1 id="logo"><a href="index.html">Fine Dining</a></h1>
							<p>Premium Interdimentional cable recipes</p>

						<!-- Nav -->
							<nav id="nav">
								<ul>
									<li><a class="icon solid fa-home" href="index.html"><span>Home</span></a></li>
									<li><a id="authLink" class="icon solid fa-sign-in-alt" href="#"><span>Login</span></a></li>
								</ul>
							</nav>

					</div>
				</section>

			<!-- Main -->
				<section id="main">
					<div class="container">
						<div class="row">
							<div id="content" class="col-12">

								<!-- Post -->
									<article class="box post">
										<header>
											<h2>Fine Dining? Ooohhwweee <strong>Cannnn do</strong><br />
										</header>
										<span class="image featured"><img src="images/banner.jpg" alt="" /></span>
									</article>

								<!-- Gallery -->
									<section>
										<header>
											<h3>Recipes</h3>
										</header>
										<div id="galleryGrid" class="gallery-grid"></div>
										<div id="galleryPager" hidden>
											<button type="button" id="galleryPrev" class="icon solid fa-chevron-left" aria-label="Previous page"></button>
											<span id="galleryPageIndicator"></span>
											<button type="button" id="galleryNext" class="icon solid fa-chevron-right" aria-label="Next page"></button>
										</div>
										<p id="galleryMessage"></p>
									</section>

							</div>
						</div>
					</div>
				</section>

			<!-- Footer -->
				<section id="footer">
					<div id="copyright" class="container">
						<ul class="links">
							<li>Template: <a href="http://html5up.net">HTML5 UP</a></li>
						</ul>
					</div>
				</section>

		</div>

		<!-- Auth modal (toggled by the Login link) -->
			<div id="authModalOverlay">
				<div id="authModal">
					<button type="button" id="authModalClose" class="icon solid fa-times" aria-label="Close"></button>
					<h3>Log in</h3>
					<form id="loginForm">
						<div class="row gtr-50">
							<div class="col-12"><input type="text" id="authUsername" name="username" placeholder="Username" required /></div>
							<div class="col-12"><input type="password" id="authPassword" name="password" placeholder="Password" required /></div>
							<div class="col-12"><button type="submit" class="button icon solid fa-sign-in-alt">Log in</button></div>
						</div>
					</form>
					<p id="authMessage"></p>
				</div>
			</div>

		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/main.js"></script>
			<script src="assets/js/auth.js"></script>
			<script src="assets/js/gallery.js"></script>

	</body>
</html>
