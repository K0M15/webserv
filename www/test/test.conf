# Integration test config for the webserv app.
# Run from the repository root:  ./webserv www/test/test.conf
server {
    listen 8080;
    server_name localhost;
    root www;
    index index.html;
    dirindex off;

    # The server enforces one combined request limit (headers + body).
    # Normal requests stay well under it; the oversized-request tests
    # deliberately exceed it.
    max_header_size 2048;
    max_body_size 4096;

    # CGI interpreters (extension -> interpreter).
    cgi .py /usr/bin/python3;
    cgi .php /usr/bin/php-cgi;

    location / {
    }
    # Redirection: /old -> /test/index.html
    location /old {
        redirect /test/index.html;
    }
    # POST uploads land here (upload handling not implemented yet -> 501).
    location /upload {
        upload_dir www/test/uploads;
    }
}

# Virtual host: same listen socket, different server_name. Requests whose
# Host header matches vhost.test are routed to this root. Run the routing
# check with:  python3 www/test/vhost_test.py
server {
    listen 8080;
    server_name vhost.test;
    root www/test/vhost;
    index index.html;
    dirindex off;

    location / {
    }
}
