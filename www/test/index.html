<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webserv Integration Tests</title>
<style>
  body { font-family: monospace; margin: 2em; background: #1e1e1e; color: #ccc; }
  h1 { color: #eee; }
  p { color: #999; }
  #controls { margin: 1em 0; }
  button { font-family: monospace; padding: .4em .8em; margin: .2em; cursor: pointer; }
  .test-row { margin: .4em 0; }
  .badge { display: inline-block; min-width: 6em; text-align: center; padding: .1em .4em; border-radius: 3px; font-size: .85em; }
  .idle    { background: #444; color: #ddd; }
  .run     { background: #2a5a8a; color: #fff; }
  .pass    { background: #1f7a1f; color: #fff; }
  .fail    { background: #a02020; color: #fff; }
  .pending { background: #8a6d1f; color: #fff; }
  pre { background: #111; padding: 1em; overflow: auto; min-height: 4em; }
</style>
</head>
<body>
<h1>Webserv Integration Tests</h1>
<p>Server under test: <span id="server">connecting...</span></p>
<div id="controls">
  <button onclick="runAll()">Run All</button>
  <button onclick="runStress()">Stress Test</button>
</div>
<div id="status"></div>
<pre id="log"></pre>
<script src="main.js"></script>
</body>
</html>
