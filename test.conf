# =====================================================================
#  webserv test configuration
#
#  Exercises: virtual hosts, PHP-CGI, Python-CGI, custom error pages,
#  local + remote redirects, uploads, directory listings.
# =====================================================================

# ---------------------------------------------------------------
# 1) Main site: default server on 0.0.0.0:8080, Host "localhost"
# ---------------------------------------------------------------
server {
    listen 8080 default_server;
    server_name localhost;
    root www;
    index index.html;
    dirindex on;

    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        methods get head post;
    }

    # --- Python CGI ---
    location /cgi-bin {
        cgi .py /usr/bin/python3;
    }

    # --- PHP CGI ---
    location /php {
        cgi .php /usr/bin/php-cgi;
    }

    # --- Uploads (POST /upload/<name>, DELETE too) ---
    location /upload {
        upload_dir www/uploads;
        methods post delete;
    }

    # --- local redirect ---
    location /old {
        redirect /new.html;
    }

    # --- redirect to a remote website ---
    location /google {
        redirect https://www.google.com;
    }
}

# ---------------------------------------------------------------
# 2) vhost: api.example.com shares port 8080, has its own root
# ---------------------------------------------------------------
server {
    listen 8080;
    server_name api.example.com;
    root www/api;
    index index.html;
    dirindex on;

    location / {
    }

    # --- remote redirect, vhost specific ---
    location /docs {
        redirect https://developer.mozilla.org;
    }
}

# ---------------------------------------------------------------
# 3) vhost: old.example.com redirects the whole site to a remote URL
# ---------------------------------------------------------------
server {
    listen 8080;
    server_name old.example.com;
    root www;
    redirect https://www.google.com;

    location / {
    }
}

# ---------------------------------------------------------------
# 4) admin site on a separate port with stricter limits
# ---------------------------------------------------------------
server {
    listen 8081 default_server;
    server_name admin.localhost;
    root www/admin;
    index index.html;
    max_body_size 10485760;
    max_header_size 8192;
    error_page 404 /errors/404.html;
    error_page 413 /errors/413.html;

    location / {
    }
}
